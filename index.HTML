<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Villa del Juicio - v0.8.6 FIX</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap');
        body { margin: 0; background: #000; color: #d4c5a3; font-family: 'MedievalSharp', cursive; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #gameContainer { position: relative; width: 800px; height: 600px; border: 4px solid #5c4033; background: #1a1a1a; outline: none; }
        canvas { display: block; }
        .ui { position: absolute; inset: 0; pointer-events: none; }
        .menu { position: absolute; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 100; }
        .btn { background: #8b4513; color: white; border: 2px solid #aaa; padding: 12px 24px; cursor: pointer; font-family: inherit; margin: 10px; font-size: 18px; }
        .btn:hover { background: #a0522d; box-shadow: 0 0 10px gold; }
        input { padding: 10px; font-family: inherit; margin: 5px; width: 250px; text-align: center; background: #222; color: #fff; border: 1px solid #8b4513; pointer-events: auto; }
        #playerList { margin: 20px; padding: 15px; border: 1px solid #555; width: 250px; background: rgba(255,255,255,0.05); min-height: 50px; }
        #chatDisplay { position: absolute; bottom: 60px; left: 20px; width: 320px; height: 120px; background: rgba(0,0,0,0.4); pointer-events: none; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 5px; border-left: 2px solid #8b4513; }
        #chatInput { position: absolute; bottom: 20px; left: 20px; width: 320px; height: 30px; pointer-events: auto; display: none; background: #000; color: white; border: 1px solid #8b4513; padding-left: 10px; font-family: inherit; }
        #hud { position: absolute; top: 15px; width: 100%; text-align: center; font-size: 24px; color: gold; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>

<div id="gameContainer" tabindex="0">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div class="ui">
        <div id="mainMenu" class="menu">
            <h1 style="color: #ff4444; font-size: 45px; margin: 0;">LA VILLA DEL JUICIO</h1>
            <input type="text" id="nodeName" placeholder="Tu Nombre" value="Bloxxer">
            <div style="margin: 10px;">
                <button class="btn" onclick="setGender('M')">👦 Caballero</button>
                <button class="btn" onclick="setGender('F')">👧 Dama</button>
            </div>
            <button class="btn" onclick="hostRoom()">CREAR SALA</button>
            <input type="text" id="joinId" placeholder="Pega el ID aquí">
            <button class="btn" onclick="joinRoom()">UNIRSE</button>
            <p id="statusLog" style="color: gold; font-size: 12px;"></p>
        </div>

        <div id="lobbyMenu" class="menu" style="display:none;">
            <h2>VILLA DE ESPERA</h2>
            <div id="playerList">Esperando jugadores...</div>
            <p id="roomCodeDisplay" style="color:cyan; font-size: 14px;"></p>
            <button id="startBtn" class="btn" style="display:none;" onclick="serverStartGame()">EMPEZAR PARTIDA</button>
            <p id="waitMsg" style="font-size: 12px; opacity: 0.7;">Solo el Host puede iniciar</p>
        </div>

        <div id="hud">V0.8.6 ONLINE</div>
        <div id="chatDisplay"></div>
        <input type="text" id="chatInput" placeholder="Enter para hablar...">
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const chatInput = document.getElementById('chatInput');
    
    let peer, myId, conn, isHost = false, gameStarted = false;
    let players = {}, connections = [];
    let phase = "DAY"; 
    let myData = { id: "", x: 400, y: 500, name: "Invitado", gender: "M", role: "Civil", scene: "WORLD", alive: true };

    function initPeer() {
        peer = new Peer();
        peer.on('open', id => { 
            myId = id; myData.id = id; 
            document.getElementById('statusLog').innerText = "Conexión lista.";
        });
        peer.on('connection', c => {
            if(isHost) {
                connections.push(c);
                c.on('data', data => handleData(data, c));
                // Forzar sincronización inmediata al conectar
                setTimeout(() => broadcast({type:'sync', players}), 500);
            }
        });
    }

    function hostRoom() {
        isHost = true;
        myData.name = document.getElementById('nodeName').value || "Host";
        players[myId] = myData;
        document.getElementById('mainMenu').style.display = 'none';
        document.getElementById('lobbyMenu').style.display = 'flex';
        document.getElementById('startBtn').style.display = 'block';
        document.getElementById('roomCodeDisplay').innerText = "ID: " + myId;
        
        // Latido constante de sincronización del Host
        setInterval(() => {
            if(!gameStarted) {
                updateLobbyUI();
                broadcast({type:'sync', players});
            }
        }, 1000);

        gameLoop();
    }

    function joinRoom() {
        const tid = document.getElementById('joinId').value;
        if(!tid) return;
        myData.name = document.getElementById('nodeName').value || "Invitado";
        conn = peer.connect(tid);
        conn.on('open', () => {
            isHost = false;
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('lobbyMenu').style.display = 'flex';
            conn.on('data', data => handleData(data));
            gameLoop();
        });
    }

    function handleData(data, sender) {
        if(data.type === 'sync') {
            players = data.players;
            updateLobbyUI();
        }
        if(data.type === 'update' && isHost) {
            players[data.id] = data.state;
        }
        if(data.type === 'start') {
            applyStart(data.roles);
        }
    }

    function broadcast(data) {
        connections.forEach(c => { if(c.open) c.send(data); });
    }

    function updateLobbyUI() {
        const list = document.getElementById('playerList');
        list.innerHTML = Object.values(players).map(p => `<div>• ${p.name}</div>`).join('');
    }

    function serverStartGame() {
        const ids = Object.keys(players);
        if(ids.length < 1) return;
        const roles = {};
        const ass = ids[Math.floor(Math.random()*ids.length)];
        ids.forEach(id => roles[id] = (id === ass ? 'Asesino' : 'Civil'));
        broadcast({type:'start', roles});
        applyStart(roles);
    }

    function applyStart(roles) {
        gameStarted = true;
        myData.role = roles[myId];
        document.getElementById('lobbyMenu').style.display = 'none';
        chatInput.style.display = 'block';
        document.getElementById('hud').innerText = "MODO: " + myData.role;
    }

    function gameLoop() {
        if(gameStarted) {
            let spd = 4;
            if(keys['w']) myData.y -= spd; if(keys['s']) myData.y += spd;
            if(keys['a']) myData.x -= spd; if(keys['d']) myData.x += spd;
        }

        // Enviar mi estado al Host constantemente
        if(isHost) {
            players[myId] = myData;
            broadcast({type:'sync', players});
        } else if(conn && conn.open) {
            conn.send({type:'update', id:myId, state:myData});
        }

        draw();
        requestAnimationFrame(gameLoop);
    }

    function draw() {
        ctx.clearRect(0,0,800,600);
        if(!gameStarted) return;
        
        ctx.fillStyle = "#2e7d32"; ctx.fillRect(0,0,800,600);
        
        Object.values(players).forEach(p => {
            ctx.fillStyle = p.gender === 'M' ? '#1976d2' : '#9c27b0';
            ctx.beginPath(); ctx.arc(p.x, p.y, 15, 0, Math.PI*2); ctx.fill();
            if(p.gender === 'F') {
                ctx.fillStyle = "#ff4081";
                ctx.beginPath(); ctx.arc(p.x-10, p.y-10, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(p.x+10, p.y-10, 5, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = "white"; ctx.textAlign = "center";
            ctx.fillText(p.name, p.x, p.y - 25);
        });
    }

    const keys = {};
    window.onkeydown = e => { 
        if(document.activeElement === chatInput && e.key === 'Enter') {
            // Lógica chat...
            chatInput.blur();
        }
        keys[e.key.toLowerCase()] = true; 
    };
    window.onkeyup = e => keys[e.key.toLowerCase()] = false;

    function setGender(g) { myData.gender = g; }
    initPeer();
</script>
</body>
</html>
